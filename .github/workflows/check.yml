# Save this file at: .github/workflows/check.yml  in your repo
# (GitHub only recognizes workflow files inside .github/workflows/)

name: Check NEET PG26 Result

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *' # every 5 min, offset to avoid peak load
  workflow_dispatch:          # lets you trigger it manually from the Actions tab too

permissions:
  contents: write   # needed so the job can commit the updated "seen" state back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run check
        run: python check_result.py

      - name: Commit updated state (only if something changed)
        run: |
          git config user.name "result-checker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_seen.txt last_status.txt last_seen_natboard.txt last_seen_parinam.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update state [skip ci]"
          git push
